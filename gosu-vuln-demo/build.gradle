plugins {
    id 'java'
    id 'org.gosu-lang.gosu' version '1.14.18'
}

group = 'com.srh.demo'
version = '1.0.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.gosu-lang.gosu:gosu-core-api:1.14.18'
    compileOnly 'javax.servlet:javax.servlet-api:4.0.1'

    // Intentionally vulnerable dependencies for SCA testing
    implementation 'org.apache.logging.log4j:log4j-core:2.14.1'
    implementation 'org.apache.commons:commons-text:1.9'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.9.8'
    implementation 'org.yaml:snakeyaml:1.30'
    implementation 'commons-collections:commons-collections:3.2.1'
    implementation 'org.springframework:spring-webmvc:5.3.17'
}

sourceSets {
    main {
        gosu {
            srcDirs = ['src/main/gosu']
        }
    }
}
